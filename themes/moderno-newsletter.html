<!-- Tema: Moderno · Newsletter -->
<!doctype html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting"><meta name="format-detection" content="telephone=no,address=no,email=no,date=no">
<meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light">
<title>{{asunto}}</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>td,th,div,p,a,h1,h2,h3,span{font-family:'Segoe UI',Arial,sans-serif !important;}</style><![endif]-->
<style type="text/css">
body{margin:0;padding:0;width:100% !important;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
table,td{border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;}
img{border:0;line-height:100%;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;}
@media only screen and (max-width:620px){
  .wrap{width:100% !important;} .px{padding-left:22px !important;padding-right:22px !important;}
  .col2,.mstack{display:block !important;width:100% !important;max-width:100% !important;padding-left:0 !important;padding-right:0 !important;}
  .hide-m{display:none !important;} .h1{font-size:26px !important;line-height:1.25 !important;}
  .full img{width:100% !important;max-width:100% !important;height:auto !important;} .center-m{text-align:center !important;}
}
</style>
</head>
<body style="margin:0;padding:0;background-color:#eef2f6;">
<div style="display:none;font-size:1px;color:#eef2f6;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{preheader}}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>
<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#eef2f6" style="background-color:#eef2f6;"><tr><td align="center" style="padding:24px 12px;">
<!--[if mso]><table role="presentation" width="600" border="0" cellpadding="0" cellspacing="0" align="center"><tr><td><![endif]-->
<table role="presentation" class="wrap" width="600" border="0" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;">
<tr><td style="padding:0 4px 12px;">
  <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"><tr>
    <td class="hide-m" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#6b7686;">{{asunto}}</td>
    <td align="right" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#6b7686;"><a href="{{ver_url}}" style="color:#6b7686;text-decoration:underline;">{{txt_ver}}</a></td>
  </tr></table></td></tr>
<tr><td bgcolor="#ffffff" style="background-color:#ffffff;border-radius:14px;overflow:hidden;">
<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
<!--sin_cabecera--><tr><td class="px" style="padding:26px 36px 18px;">
  <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"><tr>
    <td valign="middle">{{m_logo}}</td>
    <td valign="middle" align="right" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b7686;"><strong style="color:#1b2230;font-size:13px;">NEWSLETTER</strong><br>{{m_mes}}</td>
  </tr></table></td></tr>
<!--/sin_cabecera-->
<tr><td class="full" style="padding:0;">{{m_cabecera_arriba}}</td></tr>
<tr><td class="px" style="padding:30px 36px 0;">{{m_indice}}</td></tr>
<tr><td class="px" style="padding:0 36px 30px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#3d4756;text-align:left;">
{{contenido}}
</td></tr>
</table>
</td></tr>
<tr><td align="center" class="px" style="padding:26px 30px 0;">{{m_redes}}</td></tr>
<tr><td align="center" class="px" style="padding:0 30px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b7686;">{{pie}}</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body></html>

<!-- Tema: Bezares · Comunicado -->
<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<title>{{asunto}}</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--[if !mso]><!--><link href="https://fonts.googleapis.com/css?family=Ubuntu:300,400,500,700" rel="stylesheet" type="text/css"><!--<![endif]-->
<style type="text/css">
body{margin:0;padding:0;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
table,td{border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;}
img{border:0;height:auto;line-height:100%;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;}
@media only screen and (max-width:479px){.col2{display:block !important;width:100% !important;}}
</style>
</head>
<body style="margin:0;padding:0;word-spacing:normal;background-color:#d6dde5;">
<div style="display:none;font-size:1px;color:#ffffff;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{preheader}}</div>
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color:#d6dde5;"><tr><td align="center" style="padding:0;">
<!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center"><tr><td><![endif]-->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width:600px;margin:0 auto;">
<tr><td align="center" bgcolor="#ffffff" style="background:#ffffff;padding:0;">{{cabecera}}</td></tr>
<tr><td bgcolor="#ffffff" style="background:#ffffff;padding:6px 25px;">
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"><tr>
    <td align="left" style="font-family:Ubuntu, Helvetica, Arial, sans-serif;font-size:11px;color:#6d6d6d;">{{asunto}}</td>
    <td align="right" style="font-family:Ubuntu, Helvetica, Arial, sans-serif;font-size:11px;color:#6d6d6d;"><a href="{{ver_url}}" style="color:#6d6d6d;">{{txt_ver}}</a></td>
  </tr></table>
</td></tr>
<tr><td bgcolor="#ffffff" style="background:#ffffff;padding:25px 25px 30px;font-family:Ubuntu, Helvetica, Arial, sans-serif;font-size:16px;font-weight:300;line-height:1.5;color:#000000;text-align:left;">
{{contenido}}
</td></tr>
<tr><td align="center" bgcolor="{{color}}" style="background:{{color}};padding:20px 25px;font-family:Ubuntu, Helvetica, Arial, sans-serif;font-size:13px;line-height:1.5;color:#ffffff;text-align:center;">
{{pie}}
</td></tr>
</table>
<!--[if mso | IE]></td></tr></table><![endif]-->
</td></tr></table>
</body></html>
